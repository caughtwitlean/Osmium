<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>about:blank</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14'%3E🎮%3C/text%3E%3C/svg%3E" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="style.css">
    <!-- Shared proxy configuration (must load first) -->
    <script src="wisp-config.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/Destroyed12121/Staticsj@main/JS/scramjet.all.js"></script>
    <script type="module">
        // Pinned to v2.1.7 — newer bare-mux builds removed the fetch method
        // that scramjet's core relies on (matches the bundled bareworker).
        import * as BareMux from "https://cdn.jsdelivr.net/npm/@mercuryworkshop/bare-mux@2.1.7/dist/index.mjs";
        window.BareMux = BareMux;
    </script>
    <script>
        // BareMux fallback for safety if the module import fails
        if (typeof window.BareMux === "undefined") {
            window.BareMux = { BareMuxConnection: class { constructor() { } async setTransport() { return; } } };
        }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            font-family: 'Poppins', system-ui, -apple-system, sans-serif;
        }

        #iframe-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            transition: filter 0.5s ease;
            z-index: 1;
            filter: blur(15px);
        }

        #iframe-container.loaded {
            filter: blur(0);
        }

        #embed-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
        }

        .message-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
            color: var(--text);
            text-align: center;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 10;
            background: var(--bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: opacity 0.3s ease, visibility 0.3s;
        }

        .message-content {
            max-width: 420px;
            padding: 20px;
        }

        .message-content h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 8px;
        }

        .message-content p {
            color: var(--text-muted);
            font-size: 13px;
            word-break: break-all;
        }

        .message-content .loading-server {
            color: var(--success);
            font-size: 11px;
            margin-top: 6px;
            word-break: normal;
        }

        .spinner {
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #skip-btn {
            margin-top: 20px;
            padding: 8px 16px;
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.15s;
            display: none;
        }

        #skip-btn:hover {
            border-color: var(--border-light);
            color: var(--text);
        }

        .error-actions {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 20px;
        }

        .error-btn {
            padding: 8px 16px;
            background: var(--surface-2);
            color: var(--text);
            border: 1px solid var(--border-light);
            border-radius: 999px;
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
            transition: all 0.15s;
        }

        .error-btn:hover {
            background: var(--accent-soft);
            border-color: var(--accent);
            color: var(--accent-bright);
        }
    </style>
</head>

<body>
    <div id="loading" class="message-container">
        <div class="message-content">
            <div class="spinner"></div>
            <h1 id="loading-title">Connecting</h1>
            <p id="loading-url">Initializing proxy...</p>
            <p id="loading-server" class="loading-server"></p>
            <button id="skip-btn">Skip</button>
        </div>
    </div>
    <div id="error" class="message-container" style="display: none;">
        <div class="message-content">
            <h1>Connection Error</h1>
            <p id="error-message">An error occurred.</p>
            <div class="error-actions">
                <button class="error-btn" onclick="location.reload()">Retry</button>
            </div>
        </div>
    </div>
    <div id="iframe-container"></div>

    <script>
        const loadingContainer = document.getElementById('loading');
        const loadingTitle = document.getElementById('loading-title');
        const loadingUrl = document.getElementById('loading-url');
        const loadingServer = document.getElementById('loading-server');
        const errorContainer = document.getElementById('error');
        const errorMessage = document.getElementById('error-message');
        const iframeContainer = document.getElementById('iframe-container');
        const skipBtn = document.getElementById('skip-btn');

        const WISP = window.WispConfig;

        let loadingTimeout = null;
        let skipButtonTimeout = null;

        function showError(message) {
            if (loadingTimeout) clearTimeout(loadingTimeout);
            if (skipButtonTimeout) clearTimeout(skipButtonTimeout);
            loadingContainer.style.display = 'none';
            iframeContainer.innerHTML = '';
            errorMessage.textContent = message;
            errorContainer.style.display = 'flex';
        }

        function showContent() {
            if (loadingTimeout) clearTimeout(loadingTimeout);
            if (skipButtonTimeout) clearTimeout(skipButtonTimeout);
            loadingContainer.style.opacity = '0';
            loadingContainer.style.visibility = 'hidden';
            iframeContainer.classList.add('loaded');
        }

        function withTimeout(promise, ms, message) {
            return Promise.race([
                Promise.resolve(promise),
                new Promise((_, reject) => setTimeout(() => reject(new Error(message)), ms))
            ]);
        }

        async function init() {
            if (!WISP) {
                showError("Proxy configuration failed to load. Try refreshing.");
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const shouldSkip = urlParams.has('skip');
            const targetUrl = window.location.hash.substring(1);
            const basePath = location.pathname.replace(/[^/]*$/, '');

            if (!targetUrl) {
                showError("No URL provided. Use format: #https://example.com");
                return;
            }

            let validatedUrl = targetUrl;
            try {
                const decoded = decodeURIComponent(targetUrl);
                if (decoded !== targetUrl && (decoded.startsWith('http://') || decoded.startsWith('https://'))) {
                    validatedUrl = decoded;
                }
            } catch (e) {
                showError(`Invalid URL format: ${e.message}`);
                return;
            }

            try {
                new URL(validatedUrl);
            } catch (e) {
                showError(`Invalid URL: ${e.message}`);
                return;
            }

            if (!validatedUrl.startsWith('http://') && !validatedUrl.startsWith('https://')) {
                showError("Only HTTP/HTTPS URLs are supported.");
                return;
            }

            if (shouldSkip) {
                loadingContainer.style.display = 'none';
                iframeContainer.classList.add('loaded');
            }

            // Allow WISP override via query (e.g., ?wisp=wss://host/wisp/)
            const wispOverride = urlParams.get('wisp');
            if (wispOverride && WISP.isValidWispUrl(wispOverride)) {
                try { localStorage.setItem(WISP.SERVER_KEY, wispOverride); } catch (_e) { /* noop */ }
            }

            // Retry logic for initialization
            const maxInitRetries = 3;
            let initAttempt = 0;

            async function attemptInit() {
                initAttempt++;
                console.log(`Embed: Init attempt ${initAttempt}/${maxInitRetries}`);

                try {
                    if (typeof $scramjetLoadController !== "function") {
                        throw new Error("Scramjet core failed to load");
                    }
                    const { ScramjetController } = $scramjetLoadController();
                    const scramjet = new ScramjetController({
                        prefix: basePath + "scramjet/",
                        files: WISP.SCRAMJET_FILES
                    });
                    await scramjet.init();

                    // Register service worker with error handling
                    let reg;
                    try {
                        if (!('serviceWorker' in navigator)) throw new Error('Service Worker not supported');
                        reg = await navigator.serviceWorker.register(basePath + 'sw.js', { scope: basePath });
                    } catch (swErr) {
                        console.error("Embed: SW registration failed:", swErr);
                        throw new Error("Service Worker registration failed");
                    }

                    // Probe servers (saved one first) and pick the fastest reachable
                    const wispUrl = await WISP.pickBestWisp({ perServerTimeoutMs: 2500, maxTotalMs: 12000 });
                    const serverName = WISP.serverName(wispUrl);
                    if (loadingServer && !shouldSkip) {
                        loadingServer.textContent = "Connected to " + serverName;
                    }

                    // Wait for SW ready with timeout
                    await withTimeout(navigator.serviceWorker.ready, 10000, "SW ready timeout");

                    // Force update to get latest SW code
                    reg.update().catch(e => console.warn("SW update check failed:", e));

                    // Wait for controller with timeout (first visit)
                    if (!navigator.serviceWorker.controller) {
                        const controllerPromise = new Promise(resolve => {
                            const onControllerChange = () => {
                                navigator.serviceWorker.removeEventListener('controllerchange', onControllerChange);
                                resolve();
                            };
                            navigator.serviceWorker.addEventListener('controllerchange', onControllerChange);
                        });
                        await Promise.race([controllerPromise, new Promise(r => setTimeout(r, 5000))]);
                    }

                    // Send config to SW (custom URLs included so failover can honor them)
                    const configMsg = {
                        type: 'config',
                        wispurl: wispUrl,
                        customUrls: WISP.getStoredWisps().map(s => s.url)
                    };
                    const sw = reg.active || navigator.serviceWorker.controller;
                    if (sw) sw.postMessage(configMsg);
                    if (navigator.serviceWorker.controller && navigator.serviceWorker.controller !== sw) {
                        navigator.serviceWorker.controller.postMessage(configMsg);
                    }

                    // Setup BareMux connection with retry
                    let connection;
                    for (let connAttempt = 0; connAttempt < 3; connAttempt++) {
                        try {
                            connection = new BareMux.BareMuxConnection(basePath + 'bareworker.js');
                            await withTimeout(
                                connection.setTransport(WISP.TRANSPORT_URL, [{ wisp: wispUrl }]),
                                10000, "Transport setup timeout"
                            );
                            break;
                        } catch (connErr) {
                            console.warn(`Embed: Connection attempt ${connAttempt + 1} failed:`, connErr);
                            if (connAttempt === 2) throw connErr;
                            await new Promise(r => setTimeout(r, 1000 * (connAttempt + 1)));
                        }
                    }

                    if (!shouldSkip) {
                        loadingTitle.textContent = 'Loading';
                        loadingUrl.textContent = validatedUrl;
                    }

                    const frame = scramjet.createFrame();
                    frame.frame.id = 'embed-frame';
                    // Allow the proxied app to use everything it needs
                    frame.frame.setAttribute('allow', 'fullscreen; autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share; gamepad; pointer-lock; accelerometer; gyroscope; magnetometer; microphone; camera; display-capture; xr-spatial-tracking; payment');
                    frame.frame.setAttribute('allowfullscreen', '');

                    if (!shouldSkip) {
                        skipButtonTimeout = setTimeout(() => { skipBtn.style.display = 'inline-block'; }, 1500);
                        skipBtn.addEventListener('click', showContent);

                        const loadStartTime = Date.now();
                        const MIN_LOADING_TIME = 1500;

                        frame.frame.addEventListener('load', () => {
                            const elapsed = Date.now() - loadStartTime;
                            const remaining = Math.max(0, MIN_LOADING_TIME - elapsed);
                            setTimeout(showContent, remaining);
                        });

                        frame.frame.addEventListener('error', (err) => {
                            console.error("Embed: Frame error:", err);
                            // Don't immediately show error — SW may retry
                            loadingTitle.textContent = 'Retrying...';
                        });

                        loadingTimeout = setTimeout(() => {
                            try {
                                if (!frame.frame.contentWindow || frame.frame.contentWindow.location.href === 'about:blank') {
                                    showError(`Timeout: Content took too long to load. Try refreshing or switch proxy servers.`);
                                }
                            } catch (_e) { /* frame navigated — it's loading */ }
                        }, 60000);
                    } else {
                        // In skip mode, never leave the user staring at a blank frame.
                        loadingTimeout = setTimeout(() => {
                            try {
                                const win = frame.frame.contentWindow;
                                const href = win && win.location ? win.location.href : '';
                                if (!win || href === 'about:blank' || href === '') {
                                    showError(`Content took too long to load. Try refreshing or switch proxy servers.`);
                                }
                            } catch (_e) { /* cross-origin frame = loading, leave it alone */ }
                        }, 30000);
                    }

                    iframeContainer.appendChild(frame.frame);
                    frame.go(validatedUrl);

                } catch (err) {
                    console.error(`Embed: Init attempt ${initAttempt} failed:`, err);

                    if (initAttempt < maxInitRetries) {
                        if (!shouldSkip) {
                            loadingTitle.textContent = 'Retrying...';
                            loadingUrl.textContent = `Attempt ${initAttempt + 1} of ${maxInitRetries}`;
                        }
                        await new Promise(r => setTimeout(r, 1500 * initAttempt));
                        return attemptInit();
                    }

                    showError(`Connection failed after ${maxInitRetries} attempts: ${err.message}`);
                }
            }

            await attemptInit();
        }

        window.addEventListener('load', init);
    </script>
</body>

</html>
